<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INEDITA STUDIO — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080806;
      --ink: #f2f0ec;
      --orange: #c84b1f;
      --dim: rgba(242,240,236,.06);
      --display: 'Syne', sans-serif;
      --mono: 'Space Mono', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      overflow: hidden;
    }

    /* ═══ GRID BACKGROUND ═══ */
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,75,31,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,75,31,.06) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridShift 18s linear infinite;
      pointer-events: none;
    }
    @keyframes gridShift {
      from { background-position: 0 0; }
      to   { background-position: 60px 60px; }
    }

    /* ═══ SCAN LINE ═══ */
    .scan {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }
    .scan::before {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(200,75,31,.5), transparent);
      animation: scan 5s ease-in-out infinite;
      box-shadow: 0 0 18px 4px rgba(200,75,31,.18);
    }
    @keyframes scan {
      0%   { top: -2px; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* ═══ NOISE OVERLAY ═══ */
    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      opacity: .025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* ═══ CANVAS ═══ */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* ═══ LAYOUT ═══ */
    .wrap {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 44px 52px;
    }

    /* ─── TOP BAR ─── */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .logo {
      font-family: var(--display);
      font-weight: 800;
      font-size: 14px;
      letter-spacing: .12em;
    }
    .logo em { color: var(--orange); font-style: normal; }

    .sys-info {
      display: flex;
      gap: 28px;
      font-size: 8px;
      letter-spacing: .22em;
      color: rgba(242,240,236,.3);
    }
    .sys-info span { display: flex; align-items: center; gap: 6px; }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--orange);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .3; transform: scale(.6); }
    }

    /* ─── CENTER ─── */
    .center { width: 100%; }

    .sys-label {
      font-size: 9px;
      letter-spacing: .32em;
      color: rgba(242,240,236,.3);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sys-label::before {
      content: '';
      display: block;
      width: 24px; height: 1px;
      background: var(--orange);
    }

    /* ─── GLITCH TITLE ─── */
    .title-wrap {
      position: relative;
      display: inline-block;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(36px, 6vw, 82px);
      line-height: .92;
      letter-spacing: -.02em;
      color: var(--ink);
      position: relative;
    }
    h1 .accent { color: var(--orange); }

    h1::before, h1::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      font-family: var(--display);
      font-weight: 800;
      font-size: inherit;
      line-height: inherit;
      letter-spacing: inherit;
      clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
    }
    h1::before {
      color: #0ff;
      animation: glitch1 4.5s infinite;
      opacity: .4;
    }
    h1::after {
      color: #f0f;
      animation: glitch2 4.5s infinite;
      opacity: .3;
    }

    @keyframes glitch1 {
      0%,94%,100% { transform: translate(0); clip-path: polygon(0 0,100% 0,100% 0,0 0); }
      95%          { transform: translate(-3px, 1px); clip-path: polygon(0 25%,100% 25%,100% 45%,0 45%); }
      97%          { transform: translate(3px,-1px); clip-path: polygon(0 55%,100% 55%,100% 75%,0 75%); }
      99%          { transform: translate(-2px, 2px); clip-path: polygon(0 10%,100% 10%,100% 30%,0 30%); }
    }
    @keyframes glitch2 {
      0%,93%,100% { transform: translate(0); clip-path: polygon(0 0,100% 0,100% 0,0 0); }
      94%          { transform: translate(4px,-2px); clip-path: polygon(0 60%,100% 60%,100% 80%,0 80%); }
      96%          { transform: translate(-3px, 1px); clip-path: polygon(0 35%,100% 35%,100% 55%,0 55%); }
      98%          { transform: translate(2px, 2px); clip-path: polygon(0 70%,100% 70%,100% 90%,0 90%); }
    }

    /* ─── TYPEWRITER SUB ─── */
    .sub {
      margin-top: 28px;
      font-size: 11px;
      color: rgba(242,240,236,.45);
      letter-spacing: .14em;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 0;
      min-height: 16px;
    }
    .sub .cursor {
      display: inline-block;
      width: 7px; height: 13px;
      background: var(--orange);
      margin-left: 3px;
      animation: blink .8s step-end infinite;
      vertical-align: middle;
      flex-shrink: 0;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ─── PROGRESS BAR ─── */
    .progress-wrap {
      margin-top: 36px;
      width: min(420px, 100%);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      letter-spacing: .22em;
      color: rgba(242,240,236,.3);
      margin-bottom: 8px;
    }
    .progress-track {
      width: 100%;
      height: 2px;
      background: rgba(242,240,236,.08);
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      position: absolute;
      left: 0; top: 0; height: 100%;
      background: var(--orange);
      width: 0%;
      animation: fillBar 3s cubic-bezier(.4,0,.2,1) 1s forwards;
      box-shadow: 0 0 8px var(--orange);
    }
    @keyframes fillBar {
      from { width: 0% }
      to   { width: 68% }
    }
    .progress-glow {
      position: absolute;
      top: -4px; height: 10px; width: 30px;
      background: radial-gradient(ellipse at center, rgba(200,75,31,.5), transparent);
      animation: glowMove 3s cubic-bezier(.4,0,.2,1) 1s forwards;
      left: -30px;
    }
    @keyframes glowMove {
      from { left: -30px }
      to   { left: calc(68% - 15px) }
    }

    /* ─── BOTTOM ─── */
    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
    }

    .contact {
      font-size: 9px;
      letter-spacing: .18em;
      line-height: 2.4;
      color: rgba(242,240,236,.3);
    }
    .contact a {
      display: block;
      color: rgba(242,240,236,.7);
      text-decoration: none;
      transition: color .15s;
    }
    .contact a:hover { color: var(--orange); }

    .corner {
      font-size: 8px;
      letter-spacing: .2em;
      color: rgba(242,240,236,.15);
      text-align: right;
      line-height: 2.2;
    }

    /* ─── MOBILE ─── */
    @media (max-width: 600px) {
      html, body { overflow: auto; }
      .wrap { padding: 28px 24px; min-height: 100svh; height: auto; }
      h1 { font-size: clamp(30px, 10vw, 52px); }
      .sys-info { display: none; }
      .corner { display: none; }
    }
  </style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="grid"></div>
<div class="scan"></div>
<div class="noise"></div>

<div class="wrap">

  <div class="top">
    <div class="logo">INEDITA<em>.</em> STUDIO</div>
    <div class="sys-info">
      <span><div class="dot"></div>SYSTEM ONLINE</span>
      <span>OLV LAB · MAASTRICHT</span>
      <span id="clock">──:──:──</span>
    </div>
  </div>

  <div class="center">
    <div class="sys-label">STATUS · UNDER CONSTRUCTION</div>
    <div class="title-wrap">
      <h1 data-text="UNDER&#10;CONSTRUCTION">UNDER<br><span class="accent">CONSTRUCTION</span></h1>
    </div>
    <div class="sub"><span id="typewriter"></span><span class="cursor"></span></div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span>BUILD PROGRESS</span>
        <span id="pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill"></div>
        <div class="progress-glow"></div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="contact">
      <div>GET IN TOUCH</div>
      <a href="mailto:inedita23@gmail.com">inedita23@gmail.com</a>
      <a href="https://instagram.com/ineditastudio" target="_blank">@ineditastudio</a>
    </div>
    <div class="corner">
      © 2026 · ALL MATTER RESERVED<br>
      INEDITA STUDIO · NL<br>
      ARTWORKS · OBJECTS · EDITIONS
    </div>
  </div>

</div>

<script>
/* ═══ CLOCK ═══ */
function tick() {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent =
    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
}
tick(); setInterval(tick, 1000);

/* ═══ TYPEWRITER ═══ */
const phrases = [
  'Artworks, objects, editions — almost ready.',
  'Mediterranean creativity meets Dutch precision.',
  'Unique pieces that hold memory.',
  'The studio is building something new.'
];
let pi = 0, ci = 0, deleting = false, tw = document.getElementById('typewriter');
function type() {
  const phrase = phrases[pi];
  if (!deleting) {
    tw.textContent = phrase.slice(0, ++ci);
    if (ci === phrase.length) { deleting = true; setTimeout(type, 2200); return; }
    setTimeout(type, 55);
  } else {
    tw.textContent = phrase.slice(0, --ci);
    if (ci === 0) { deleting = false; pi = (pi + 1) % phrases.length; setTimeout(type, 400); return; }
    setTimeout(type, 28);
  }
}
setTimeout(type, 800);

/* ═══ PROGRESS COUNTER ═══ */
(function() {
  const el = document.getElementById('pct');
  let v = 0;
  const target = 68;
  const start = Date.now() + 1000;
  const dur = 3000;
  function step() {
    const elapsed = Math.max(0, Date.now() - start);
    const t = Math.min(elapsed / dur, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    v = Math.round(ease * target);
    el.textContent = v + '%';
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();

/* ═══ PARTICLES ═══ */
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, pts;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function makePoints(n) {
    return Array.from({length: n}, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - .5) * .35,
      vy: (Math.random() - .5) * .35,
      r: Math.random() * 1.2 + .4
    }));
  }

  const LINK = 130;
  const N    = 55;

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(200,75,31,.55)';
      ctx.fill();
    }

    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x;
        const dy = pts[i].y - pts[j].y;
        const d  = Math.sqrt(dx * dx + dy * dy);
        if (d < LINK) {
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.strokeStyle = `rgba(200,75,31,${(1 - d / LINK) * .12})`;
          ctx.lineWidth = .5;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);
  }

  resize();
  pts = makePoints(N);
  window.addEventListener('resize', () => { resize(); pts = makePoints(N); });
  draw();
})();
</script>
</body>
</html>
